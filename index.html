
<script>
const EVENT_LOG = "./sample_events.jsonl";

const stageLabels = {
  bundle_created: "Encrypted bundle created",
  key_ceremony: "Three-key ceremony",
  waiting: "Waiting for release",
  release: "Timed release",
  qr_shown: "Release QR displayed",
  node_scanned: "Print node verified",
  printing: "Printing started",
  jam: "Printer jam detected",
  resumed: "Printing resumed",
  complete: "Printing completed",
  leak_received: "Leak report received",
  trace_result: "Forensic trace result"
};

async function runDemo() {
  const timeline = document.getElementById("timeline");
  timeline.textContent = "Loading simulated event log...";

  try {
    const response = await fetch(EVENT_LOG + "?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Could not load event log (HTTP " + response.status + ")");
    }

    const raw = await response.text();
    const events = raw.trim().split(/\r?\n/)
      .filter(line => line.trim())
      .map(line => JSON.parse(line));

    if (!events.length) {
      throw new Error("The event log is empty.");
    }

    // Build the timeline safely from the JSONL records.
    timeline.replaceChildren();

    events.forEach(event => {
      const row = document.createElement("div");
      row.className = "event";

      const description = document.createElement("span");
      description.textContent =
        (stageLabels[event.stage] || event.stage) +
        " — " + event.details;

      const status = document.createElement("span");
      status.className = "status";

      if (event.status === "warning") {
        status.classList.add("warn");
      } else if (event.status !== "ok") {
        status.classList.add("pending");
      }

      status.textContent = event.status.toUpperCase();
      row.append(description, status);
      timeline.appendChild(row);
    });

    const has = stage => events.some(e => e.stage === stage);
    const last = stage =>
      [...events].reverse().find(e => e.stage === stage);

    document.getElementById("bundle").textContent =
      has("bundle_created") ? "Created" : "Pending";

    document.getElementById("release").textContent =
      has("release") ? "Released" : "Waiting";

    document.getElementById("clock").textContent =
      has("release") ? "Simulated release event recorded"
                     : "Awaiting simulated release";

    const completed = has("complete");
    document.getElementById("progress").textContent =
      completed ? "120 / 120" : has("printing") ? "Printing" : "0 / 120";

    document.getElementById("bar").style.width =
      completed ? "100%" : has("printing") ? "35%" : "0%";

    document.getElementById("printstatus").textContent =
      completed ? "Completed in simulation" :
      has("jam") ? "Jam recorded; recovery pending" :
      has("printing") ? "Printing in progress" : "Not started";

    document.getElementById("trace").textContent =
      has("trace_result") ? "Demo match recorded" :
      has("leak_received") ? "Investigation pending" : "Pending";

    const result = last("trace_result");
    const centre = result?.center_id || "—";

    document.getElementById("centre").textContent = centre;
    document.getElementById("series").textContent = "Not specified";
    document.getElementById("serial").textContent = "Not specified";
    document.getElementById("seat").textContent = "Not established";
    document.getElementById("confidence").textContent = "Not measured";
    document.getElementById("layers").textContent =
      result ? result.details : "No trace result";

    document.getElementById("disclaimer").textContent =
      "Simulated event log only. A trace match is an investigative lead, " +
      "not proof of who leaked the paper.";

  } catch (error) {
    timeline.textContent =
      "Unable to load event log: " + error.message +
      ". Check that sample_events.jsonl is published in the repository root.";
  }
}

function resetDemo() {
  location.reload();
}
</script>
